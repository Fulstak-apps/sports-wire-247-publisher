name: Sports Wire 24/7 monitor and publisher

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "queue/**"
      - "media/**"

permissions:
  contents: write

concurrency:
  group: sports-wire-247-publisher
  cancel-in-progress: false

jobs:
  monitor-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Check explicit SportsWire publishing gate
        id: gate
        run: |
          enabled="$(python -c 'import json; print(str(json.load(open("deployment/meta-apps.json")).get("publishing_enabled", False)).lower())')"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != "true" ]; then
            echo "SportsWire Meta apps are not marked live. No queue generation or posting will run."
          fi

      - name: Install Python dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: python -m pip install --disable-pip-version-check pillow openai

      - name: Generate one verified sports package
        if: steps.gate.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.SPORTS_WIRE_OPENAI_API_KEY }}
          MAX_NEW_ITEMS: "30"
          MAX_SOURCE_AGE_HOURS: "24"
        run: python scripts/ai-crashout.py

      - name: Validate ready SportsWire items
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for item in queue/*.json; do
            if python -c 'import json,sys; raise SystemExit(0 if json.load(open(sys.argv[1])).get("status")=="ready" else 1)' "$item"; then
              python scripts/validate_queue.py "$item"
            fi
          done

      - name: Convert oversized source images
        if: steps.gate.outputs.enabled == 'true'
        run: python scripts/convert-media-to-jpeg.py

      - name: Commit generated queue and media before Meta fetches them
        if: steps.gate.outputs.enabled == 'true'
        run: |
          if [ -z "$(git status --porcelain -- queue media)" ]; then exit 0; fi
          git config user.name "Sports Wire 24/7"
          git config user.email "actions@users.noreply.github.com"
          git add queue media
          git commit -m "Queue verified Sports Wire 24/7 story"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish one SportsWire story
        if: steps.gate.outputs.enabled == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.SPORTS_WIRE_INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.SPORTS_WIRE_INSTAGRAM_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.SPORTS_WIRE_THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.SPORTS_WIRE_THREADS_USER_ID }}
          PUBLISH_INSTAGRAM_STORIES: "true"
          MAX_FEED_POSTS_PER_RUN: "1"
        run: node scripts/publish-instagram.mjs

      - name: Save publication state
        if: always() && steps.gate.outputs.enabled == 'true'
        run: |
          if [ -z "$(git status --porcelain -- queue)" ]; then exit 0; fi
          git config user.name "Sports Wire 24/7"
          git config user.email "actions@users.noreply.github.com"
          git add queue
          git commit -m "Save Sports Wire 24/7 publication state" || true
          git pull --rebase origin main
          git push origin HEAD:main
